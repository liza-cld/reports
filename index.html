<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderation Reports</title>
<style>
  :root { --ink:#1a1f2b; --muted:#6b7280; --line:#e6e8ec; --bg:#f7f8fa; --link:#1257c4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 28px 80px; }
  h1 { margin:0 0 4px; font-size:26px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  ul.reports { list-style:none; padding:0; margin:0; }
  ul.reports li { background:#fff; border:1px solid var(--line); border-radius:12px;
                  padding:16px 18px; margin:12px 0; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  ul.reports a { color:var(--link); text-decoration:none; font-size:17px; font-weight:600; }
  ul.reports a:hover { text-decoration:underline; }
  .desc { color:var(--muted); font-size:13px; margin-top:4px; }
  footer { color:var(--muted); font-size:12px; margin-top:40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Moderation Reports</h1>
  <div class="sub">Brand-Aligned Moderation — pilot results</div>
  <ul class="reports">
    <li>
      <a href="ScottDunn/">Scott Dunn</a>
      <div class="desc">Image moderation report — web-match verification and duplicate-upload detection.</div>
    </li>
    <li>
      <a href="Embroidery/">Embroidery Analysis</a>
      <div class="desc">Embroidery-readiness checks on vector logo artwork — POC on two example logos.</div>
    </li>
  </ul>
  <footer>Cloudinary Moderation</footer>
</div>
</body>
</html>
